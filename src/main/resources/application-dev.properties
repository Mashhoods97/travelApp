# ===============================
# =   Server Configuration     =
# ===============================
server.port=8081

# ===============================
# =   Database Configuration   =
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/tp88?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# =   JPA / Hibernate           =
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# =   Logging                   =
# ===============================
logging.level.org.springframework=INFO
logging.level.com.yourcompany=DEBUG

# ===============================
# =   File Upload Paths         =
# ===============================
file.upload-dir=./uploads

# ===============================
# =   JWT Configuration         =
# ===============================
jwt.secret========================TP=Com=Spring===========================
jwt.expirationMs=86400000

# ===============================
# =   liquibase           =
# ===============================

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.contexts= # optional contexts
spring.liquibase.default-schema=tp88
spring.liquibase.liquibase-schema=tp88
spring.liquibase.liquibase-tablespace= # optional tablespace
spring.liquibase.database-change-log-table=DATABASECHANGELOG
spring.liquibase.database-change-log-lock-table=DATABASECHANGELOGLOCK
spring.liquibase.drop-first=false
